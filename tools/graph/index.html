<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/apexcharts@8.8.1/dist/apexcharts.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="js/script.js" defer></script>

  <title>Graph</title>
</head>

<body>
  <header>
    <span class="material-symbols-outlined logo-icon">query_stats</span>
    <h1>Graph</h1>
  </header>
  <main>
    <aside class="sidebar">
      <div class="datasets">

        <div class="dropdown-header">
          <h2>Datasets</h2>
          <span class="material-symbols-outlined">expand_more</span>
        </div>

        <div class="dropdown-content">
          <div class="dataset-list"></div>

          <p class="empty-state">No datasets yet</p>

          <button class="new-dataset"> New dataset </button>
        </div>

      </div>

      <div class="chart-types">

        <div class="dropdown-header">
          <h2>Chart Types</h2>
          <span class="material-symbols-outlined">expand_more</span>
        </div>

        <div class="dropdown-content">
          <h3>aoba</h3>
        </div>

      </div>



      <div class="customization">

        <div class="dropdown-header">

          <h2>Customization</h2>
          <span class="material-symbols-outlined">expand_more</span>
        </div>

        <div class="dropdown-content">
          <h3>Data</h3>

          <div class="data-editor">
            <div class="category-list"></div>
            <input type="text" class="category-input" placeholder="Category name">
            <button class="add-category">Add category</button>
          </div>

        </div>
    </aside>

    <section class="workspace">
      <h2 class="dataset-title">Select a dataset</h2>
      <!--sempre aparece, fica em cima centralizado com o bloco do container.-->
      <button class="dataset-config" hidden>
        <span class="material-symbols-outlined config-button">settings</span> <!--fica no topo superior direito-->
      </button>
      <div class="graph-container"> <!--isso só aparece depois de selecionar um dataset, dentro do container-->

        <div class="graph-header">
          <h2 class="graph-title" hidden>Select a graph</h2>
        </div>

        <div class="chart"></div>

      </div>
    </section>
  </main>

  <dialog class="dataset-modal">
    <h2>New dataset</h2>

    <form>
      <input type="text" placeholder="Dataset name" required>

      <div class="modal-actions">
        <button type="button">Cancel</button>
        <button type="submit">Create</button>
      </div>
    </form>
  </dialog>

  <dialog class="config-modal">
    <h2>Dataset Settings</h2>

    <p class="config-dataset-name"></p>

    <button class="delete-dataset" type="submit">Delete dataset</button>

    <button class="close-config" type="button">Close</button>
  </dialog>

  <dialog class="delete-confirm-modal">
    <h2>Are you sure?</h2>
    <p>This action can't be undone.</p>

    <div class="modal-actions">
      <button class="cancel-delete" type="button">Cancel</button>
      <button class="confirm-delete" type="submit">Delete</button>
    </div>
  </dialog>

  <footer>
    <p>&copy; 2026 Graph - Made by Lucas</p>
    <img src="../../assets/images/Brasil.svg" alt="Brasil">
  </footer>
</body>

</html>
