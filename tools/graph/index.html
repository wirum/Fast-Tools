<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="js/script.js" defer></script>

  <title>Graph</title>
</head>

<body>
  <header>
    <span class="material-symbols-outlined logo-icon">query_stats</span>
    <h1>Graph</h1>
  </header>
  <main>
    <aside class="sidebar">
      <div class="datasets">

        <div class="dropdown-header">
          <h2>Datasets</h2>
          <span class="material-symbols-outlined">expand_more</span>
        </div>

        <div class="dropdown-content">
          <div class="dataset-list"></div>

          <p class="empty-state">No datasets yet</p>

          <button class="new-dataset"> New dataset </button>
        </div>

      </div>

      <div class="chart-types">

        <div class="dropdown-header">
          <h2>Chart Types</h2>
          <span class="material-symbols-outlined">expand_more</span>
        </div>

        <div class="dropdown-content">
          <h3>aoba</h3>
        </div>

      </div>



      <div class="customization">

        <div class="dropdown-header">

          <h2>Customization</h2>
          <span class="material-symbols-outlined">expand_more</span>
        </div>

        <div class="dropdown-content">
          <h3>aoba</h3>
        </div>

      </div>
    </aside>

    <section class="workspace">
      <div class="graph-container">
        <h2>graph-container</h2>
      </div>
    </section>
  </main>

  <dialog class="dataset-modal">
    <h2>New dataset</h2>

    <form>
      <input type="text" placeholder="Dataset name" required>

      <div class="modal-actions">
        <button type="button">Cancel</button>
        <button type="submit">Create</button>
      </div>
    </form>
  </dialog>
  <footer>
    <p>&copy; 2026 Graph - Made by Lucas</p>
    <img src="../../assets/images/Brasil.svg" alt="Brasil">
  </footer>
</body>

</html>
