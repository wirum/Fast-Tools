<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="js/script.js" defer></script>

  <title>Chrono</title>
</head>

<body>
  <header class="title">
    <h1 class="main-title"> Chrono
        <span class="badge">Timer</span>
    </h1>
        <img src="../../assets/Chrono/halloweensticker.png" width="100px" alt="Terra's Halloween Sticker">
  </header>

  <main>
    <section class="clock">
        <h2 class="secondary-title">Clock</h2>
        <time id="clock-time">00:00:00</time>
        <div class="clock-info">
          <time id="date">Loading date..</time>
          <p id="timezone">Loading timezone..</p>
        </div>
    </section>

    <section class="stopwatch"> 
      <h2 class="secondary-title">Stopwatch</h2>
      <div class="stopwatchDisplay">
        <p id="timeDisplay">00:00:00.00</p>
        <p id="lapTimeDisplay">00:00:00.00</p>
      </div>

      <div class="stopwatch-buttons">
        <button id="start" onclick="toggleStopwatch()" aria-label="Start stopwatch">
          <i data-lucide="play"></i>
        </button>

        <button id="restart" onclick="resetStopwatch()" aria-label="Restart stopwatch">
          <i data-lucide="rotate-ccw"></i>
        </button>

        <button id="lap" onclick="markLap()" aria-label="Mark lap">
          <i data-lucide="flag"></i>
        </button>
      </div>

      <div class="lapDisplay">
        <button id="toggleLaps" onclick="toggleLapHistory()" aria-expanded="true" aria-controls="laps">
          <span class="button-text">Lap History</span>
          <i data-lucide="chevron-down"></i>
        </button> 

        <div id="laps"></div>
      </div>
    </section>

    <section class="timer">
      <h2 class="secondary-title">Timer</h2>
      <div class="timerDisplay">
        <p id="timerTime">00:00:00.00</p>
      </div>
      <div class="timerButtons">
        <button id="timerToggle" aria-label="Timer toggle"><i data-lucide="play"></i></button>
        <button id="timerReset" aria-label="Timer reset"><i data-lucide="rotate-ccw"></i></button>
        <button id="timerClear" aria-label="Timer clear"><i data-lucide="eraser"></i></button>
      </div>
      <div class="shortcutButtons">
        <button data-minutes="1" aria-label="Add 1 minute">+1m</button>
        <button data-minutes="-1" aria-label="Remove 1 minute">-1m</button>
        <button data-minutes="3" aria-label="Add 3 minutes">+3m</button>
        <button data-minutes="-3" aria-label="Remove 3 minutes">-3m</button>
        <button data-minutes="5" aria-label="Add 5 minutes">+5m</button>
        <button data-minutes="-5" aria-label="Remove 5 minutes">-5m</button>
      </div>
      <div class="secondaryInput">
        <input id="timerSecondaryInput" type="text" placeholder="Enter time" aria-label="Input for time">
        <button id="timerSet" aria-label="Set timer by input above">Set</button>
      </div>
    </section>

    <section class="pomodoro">
      <h2 class="secondary-title">Pomodoro <span class="title-extra">Timer</span></h2>
      <div class="pomodoroDisplay">
        <p id="pomodoroTime">25:00</p>
      </div>
      <p class="pomodoroStatus">Not Running..</p>
      <div class="pomodoroButtons">
        <button id="pomodoroToggle" aria-label="Pomodoro toggle"><i data-lucide="play"></i></button>
        <button id="pomodoroReset" aria-label="Reset Pomodoro"><i data-lucide="rotate-ccw"></i></button>
      </div>
      <div class="pomodoroShortcut">
        <button data-pomodoro="15" aria-label="Set 15 minute focus duration">15m</button>
        <button data-pomodoro="25" aria-label="Set 25 minute focus duration">25m</button>
        <button data-pomodoro="50" aria-label="Set 50 minute focus duration">50m</button>
      </div>
      <div class="pomodoroInput">
        <input id="pomodoroInput" type="text" placeholder="Enter time" aria-label="Input for focus">
        <button id="pomodoroSet" aria-label="Set pomodoro by input above">Set</button>
      </div>
    </section>
    <section class="alarm">
      <h1 class="secondary-title">Alarm</h1>
      <div class="alarmDisplay">
        <p id="alarmTime">00:00:00</p>
      </div>
      <p class="alarmStatus">Not running..</p>
      <div class="alarmButtons">
        <button id="setAlarm"><i data-lucide="play"></i></button>
        <button id="clearAlarm"><i data-lucide="eraser"></i></button>
      </div>
      <div class="alarmInput">
        <input id="alarmInput" type="time" placeholder="Enter time" aria-label="Input for alarm">
      </div>
      <div class="alarmShortcuts">
        <button alarm-minutes="1" aria-label="Add 1 minute">+1m</button>
        <button alarm-minutes="-1" aria-label="Remove 1 minute">-1m</button>
        <button alarm-minutes="3" aria-label="Add 3 minutes">+3m</button>
        <button alarm-minutes="-3" aria-label="Remove 3 minutes">-3m</button>
        <button alarm-minutes="5" aria-label="Add 5 minutes">+5m</button>
        <button alarm-minutes="-5" aria-label="Remove 5 minutes">-5m</button>
      </div>

    </section>
  </main>

  <footer>
    <p>&copy; 2026 Chrono - Made by Lucas</p>
    <img src="../../assets/images/Brasil.svg" alt="Brasil flag">
  </footer>
</body>

</html>
