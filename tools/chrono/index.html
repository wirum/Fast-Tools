<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="js/script.js" defer></script>

  <title>Chrono</title>
</head>

<body>
  <header>
    <h1 class="main-title"> Chrono
        <span class="badge">Timer</span>
    </h1>
  </header>

  <main>
    <section class="clock">
        <h1 class="secondary-title">Clock</h1>
        <p id="clock-time">00:00:00</p>
        <div class="clock-info">
          <p id="date">Loading date..</p>
          <p id="timezone">Loading timezone..</p>
        </div>
    </section>

    <section class="stopwatch">
      <h1 class="secondary-title">Stopwatch</h1>
      <div class="stopwatchDisplay">
        <p id="timeDisplay">00:00:00.00</p>
        <p id="lapTimeDisplay">00:00:00.00</p>
      </div>

      <div class="stopwatch-buttons">
        <button id="start" onclick="toggleStopwatch()">
          <i data-lucide="play"></i>
        </button>

        <button id="restart" onclick="resetStopwatch()">
          <i data-lucide="rotate-ccw"></i>
        </button>

        <button id="lap" onclick="markLap()">
          <i data-lucide="flag"></i>
        </button>
      </div>

      <div class="lapDisplay">
        <button id="toggleLaps" onclick="toggleLapHistory()" aria-expanded="true">
          <span class="button-text">Lap History</span>
          <i data-lucide="chevron-down"></i>
        </button> 

        <div id="laps"></div>
      </div>
    </section>

    <section class="timer">
      <h1 class="secondary-title">Timer</h1>
      <div class="timerDisplay">
        <input id="timerTime" type="text" value="00:00:00.00" readonly>
      </div>
      <div class="timerButtons">
        <button id="timerStart">Start</button>
        <button id="timerReset">Reset</button>
        <button id="timerPause">Pause</button>
      </div>
      <div class="shortcutButtons">
        <button data-minutes="1">+1m</button>
        <button data-minutes="-1">-1m</button>
        <button data-minutes="3">+3m</button>
        <button data-minutes="-3">-3m</button>
        <button data-minutes="5">+5m</button>
        <button data-minutes="-5">-5m</button>
      </div>
      <div class="secondaryInput">
        <input id="timerSecondaryInput" type="text" placeholder="Enter time (HH:MM:SS:CC)">
        <button id="timerSet">Set</button>
      </div>
    </section>

    <section class="pomodoro">
      <h1 class="secondary-title">Pomodoro Timer</h1>

    </section>
  </main>

  <footer>
    <p>&copy; 2026 Chrono - Made by Lucas</p>
    <img src="../../assets/images/Brasil.svg">
  </footer>
</body>

</html>
