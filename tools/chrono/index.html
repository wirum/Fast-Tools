<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>

  <title>Chrono</title>
</head>

<body>
  <header>
    <h1 class="main-title">
        Chrono
        <span class="badge">Timer</span>
    </h1>
  </header>

  <main>
    <section class="clock">
        <h1 class="secondary-title">Clock</h1>
        <p id="clock-time">00:00:00</p>
        <div class="clock-info">
          <p id="date">Loading date..</p>
          <p id="timezone">Loading timezone..</p>
        </div>
    </section>

    <section class="stopwatch">
      <h1 class="secondary-title">Stopwatch</h1>
      <p id="time-display">00:00.0</p>
      <div class="stopwatch-buttons">
        <button id="start"></button>
        <button id="restart"></button>
        <button id="lap"></button>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Calcify - Made by Lucas</p>
    <img src="../../assets/images/Brasil.svg">
  </footer>
</body>

</html>
